name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_PATH: /Applications/Xcode_27.1.app
  PROJECT: Trackdown.xcodeproj
  SCHEME: Trackdown
  SIMULATOR: iPhone 18 Pro
  PACKAGES_DIR: .build/SourcePackages
  DERIVED_DATA: .build/DerivedData

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: sudo xcode-select --switch "$XCODE_PATH"

      - name: swift-format lint
        run: |
          xcrun swift-format --version
          xcrun swift-format lint --strict --recursive --parallel Trackdown Packages

  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      # Boot the simulator now so it is ready by the time the build finishes,
      # instead of booting cold inside `xcodebuild test`. The device name can
      # exist on several runtimes, so pin the UDID on the newest one.
      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r --arg name "$SIMULATOR" '
            .devices
            | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key | capture("iOS-(?<v>[0-9]+(-[0-9]+)*)").v | split("-") | map(tonumber))
            | reverse
            | map(.value[] | select(.name == $name))
            | first
            | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No available simulator named $SIMULATOR"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting $SIMULATOR ($udid)"
          xcrun simctl boot "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PACKAGES_DIR }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode-27.1-${{ hashFiles('**/Package.resolved', 'Packages/*/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode-27.1-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR"

      # Warnings are errors for the app target and our local packages. Xcode
      # builds remote package dependencies with warnings suppressed, so these
      # settings never fail the build on third-party code.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      # Parallel testing would clone and boot a fresh simulator per worker.
      # Swift Testing still runs tests in parallel inside each test bundle.
      - name: Test
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: .build/TestResults.xcresult
          if-no-files-found: ignore
