name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_PATH: /Applications/Xcode_27.1.app
  PROJECT: Trackdown.xcodeproj
  SCHEME: Trackdown
  PACKAGES_DIR: .build/SourcePackages
  DERIVED_DATA: .build/DerivedData
  # Read by Config/Base.xcconfig (app target) and the local Package.swift
  # manifests (package targets) to treat warnings as errors. Remote packages
  # never see it, so third-party warnings never fail the build.
  TRACKDOWN_WARNINGS_AS_ERRORS: "YES"

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: sudo xcode-select --switch "$XCODE_PATH"

      - name: swift-format lint
        run: |
          xcrun swift-format --version
          xcrun swift-format lint --strict --recursive --parallel Trackdown Packages

  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PACKAGES_DIR }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode-27.1-${{ hashFiles('**/Package.resolved', 'Packages/*/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode-27.1-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR"

      # Builds the app and the scheme's test bundles for the iOS Simulator, so
      # iOS-only compile errors still fail CI. A generic destination needs no
      # booted simulator.
      # Warnings are errors for the app target and our local packages through
      # TRACKDOWN_WARNINGS_AS_ERRORS. Do not pass SWIFT_TREAT_WARNINGS_AS_ERRORS
      # here: a command-line setting reaches remote packages too, and conflicts
      # with the -suppress-warnings Xcode builds them with.
      # -skipPackagePluginValidation trusts the Swift OpenAPI Generator build
      # plugin, which Xcode otherwise asks a person to enable.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            TRACKDOWN_WARNINGS_AS_ERRORS=YES

      # Runs the Swift Testing suites on the macOS host instead of a simulator.
      # A cold simulator boot took over 3 minutes on this runner; the tests
      # themselves take seconds. Every package with a Tests folder must list
      # macOS in its platforms.
      - name: Test packages
        run: |
          set -euo pipefail
          for package in Packages/*/; do
            if [ -d "${package}Tests" ]; then
              echo "::group::swift test ${package}"
              swift test --package-path "$package"
              echo "::endgroup::"
            fi
          done
